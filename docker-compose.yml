version: '3.8'

services:
  discord-bot:
    build: .
    container_name: berry-fox-bot
    restart: unless-stopped
    # 環境變數在 Portainer UI 中設定（推薦方式）
    # Portainer → Stacks → Edit → Environment variables
    networks:
      - berryfox-network
    # 本地測試時使用（可選）
    # volumes:
    #   - ./prisma/:/app/prisma/

  redis:
    image: redis:7-alpine
    container_name: berry-fox-redis
    restart: unless-stopped
    networks:
      - berryfox-network
    # 本地測試時公開埠口
    # ports:
    #   - "6379:6379"

networks:
  berryfox-network:
    driver: bridge